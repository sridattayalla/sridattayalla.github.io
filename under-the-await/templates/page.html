<!DOCTYPE html>
<!--
  ==========================================================================
  UNDER THE AWAIT — CONTENT PAGE TEMPLATE
  ==========================================================================
  WRITER CONTRACT — copy this file into the right part directory and fill in
  exactly FOUR things:

    1. <title>PLACEHOLDER</title>            → "Page title — Under the Await"
    2. <meta name="description" ...>         → one-sentence summary
    3. <body data-page="PLACEHOLDER-ID">     → the page's manifest id
                                              (e.g. "p01-03" — see assets/main.js)
    4. Everything between the CONTENT markers in <main id="content">

  Do NOT touch: the <head> links and scripts, the empty
  <aside id="site-nav">, or the empty <nav id="page-nav">. main.js renders
  the sidebar, the prev/next footer, code highlighting and the ← / → keys.
  Paths are already correct for pages one level below the site root
  (../assets/...). No external URLs, no webfonts, no inline event handlers.

  CONTENT CLASSES (full list + tokens documented at the top of
  assets/style.css):
    .note / .warning / .pitfall     callouts (labels auto-generated)
    aside.takeaways                 end-of-page summary box (supply a heading)
    figure.diagram + figcaption     inline SVG figures; style shapes with
                                    svg classes .box .arrow .arrow-head
                                    .lane .label (+ .accent, .label.muted/mono)
    table                           book-style, scrolls horizontally if wide
    pre > code                      code block; add class="language-rust"
                                    (also c, javascript, python, bash, …)
    <code> inline · <kbd>           tinted mono · keycap
  ==========================================================================
-->
