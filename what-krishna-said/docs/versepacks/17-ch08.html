<figure class="verse" data-verse="8.3">
<figcaption>Bhagavad Gita 8.3</figcaption>
<blockquote class="iast">akṣaraṃ brahma paramaṃ svabhāvo&#x27;dhyātmamucyate | bhūtabhāvodbhavakaro visargaḥ karmasaṃjñitaḥ</blockquote>
<p class="gloss">The imperishable — that is the highest brahman; its dwelling in each body is called the self; the letting-forth that brings beings to birth is called action.</p>
<p class="note"><strong>Translation note</strong> The Gita defining its own key terms: brahman, adhyātma, karma.</p>
</figure>

<figure class="verse" data-verse="8.5">
<figcaption>Bhagavad Gita 8.5</figcaption>
<blockquote class="iast">antakāle ca māmeva smaranmuktvā kalevaram | yaḥ prayāti sa madbhāvaṃ yāti nāstyatra saṃśayaḥ</blockquote>
<p class="gloss">Whoever, at the time of death, lets go of the body remembering me alone — that one goes to my being; there is no doubt.</p>
</figure>

<figure class="verse" data-verse="8.6">
<figcaption>Bhagavad Gita 8.6</figcaption>
<blockquote class="iast">yaṃ yaṃ vāpi smaranbhāvaṃ tyajatyante kalevaram | taṃ tamevaiti kaunteya sadā tadbhāvabhāvitaḥ</blockquote>
<p class="gloss">Whatever state of being one remembers when quitting the body at the end — to that very state one goes, always made of that memory.</p>
</figure>

<figure class="verse" data-verse="8.7">
<figcaption>Bhagavad Gita 8.7</figcaption>
<blockquote class="iast">tasmātsarveṣu kāleṣu māmanusmara yudhya ca | mayyarpitamanobuddhirmāmevaiṣyasyasaṃśayaḥ</blockquote>
<p class="gloss">Therefore at all times remember me — and fight. With mind and understanding entrusted to me, you shall come to me; there is no doubt.</p>
<p class="note"><strong>Translation note</strong> &#x27;Remember me and fight&#x27; — devotion and battle in one breath; the verse that most embarrasses pacifist readings and energizes activist ones.</p>
</figure>

<figure class="verse" data-verse="8.22">
<figcaption>Bhagavad Gita 8.22</figcaption>
<blockquote class="iast">puruṣaḥ sa paraḥ pārtha bhaktyā labhyastvananyayā | yasyāntaḥsthāni bhūtāni yena sarvamidaṃ tatam</blockquote>
<p class="gloss">That is the highest person, Partha, in whom beings dwell, by whom all this is pervaded — attained by devotion and by nothing else.</p>
</figure>
