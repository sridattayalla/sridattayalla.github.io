<figure class="verse" data-verse="2.47">
<figcaption>Bhagavad Gita 2.47</figcaption>
<blockquote class="iast">karmaṇyevādhikāraste mā phaleṣu kadācana | mā karmaphalaheturbhūrmā te saṅgo&#x27;stvakarmaṇi</blockquote>
<p class="gloss">Your right is to the action alone, never to its fruits; do not let the fruits be your motive; neither let there be attachment to inaction.</p>
<p class="note"><strong>Translation note</strong> The most translated verse of the Gita. &#x27;Adhikāra&#x27; = right/claim/jurisdiction; &#x27;phala-hetu&#x27; = cause/reason-in-the-fruit. Whether this counsels detachment from outcome, selfless service, devotional service, or psychological non-clutching is the fork the whole book turns on.</p>
</figure>

<figure class="verse" data-verse="4.13">
<figcaption>Bhagavad Gita 4.13</figcaption>
<blockquote class="iast">cāturvarṇyaṃ mayā sṛṣṭaṃ guṇakarmavibhāgaśaḥ | tasya kartāramapi māṃ viddhyakartāramavyayam</blockquote>
<p class="gloss">The four-varna order I made, according to strand and action; though its maker, know me as non-maker, imperishable.</p>
<p class="note"><strong>Translation note</strong> The fork of forks. &#x27;Guṇa-karma&#x27; = &#x27;by quality and function&#x27; or &#x27;by quality-born action&#x27; — read as anti-birth by some devotee commentators, as divine sanction of hierarchy by critics such as Ambedkar, and as a later interpolation by some historians.</p>
</figure>

<figure class="verse" data-verse="9.32">
<figcaption>Bhagavad Gita 9.32</figcaption>
<blockquote class="iast">māṃ hi pārtha vyapāśritya ye&#x27;pi syuḥ pāpayonayaḥ | striyo vaiśyāstathā śūdrāste&#x27;pi yānti parāṃ gatim</blockquote>
<p class="gloss">Taking refuge in me, even those born of ill wombs — women, vaishyas, shudras likewise — even they go the highest way.</p>
<p class="note"><strong>Translation note</strong> The Gita&#x27;s most debated inclusion verse: does &#x27;even they&#x27; open heaven&#x27;s door to the excluded, or confirm who was excluded? Read both ways across two millennia.</p>
</figure>

<figure class="verse" data-verse="18.66">
<figcaption>Bhagavad Gita 18.66</figcaption>
<blockquote class="iast">sarvadharmānparityajya māmekaṃ śaraṇaṃ vraja | ahaṃ tvā sarvapāpebhyo mokṣayiṣyāmi mā śucaḥ</blockquote>
<p class="gloss">Letting go all duties, come take refuge in me alone; I will free you from all wrongs — do not grieve.</p>
<p class="note"><strong>Translation note</strong> The &#x27;charama śloka&#x27;. Whether &#x27;abandoning all dharmas&#x27; means abandoning works for grace (Ramanuja), or the ego&#x27;s claim on outcomes (Gandhi), or exclusive devotion (Bhaktivedanta) — this single verse holds the entire interpretive war.</p>
</figure>
