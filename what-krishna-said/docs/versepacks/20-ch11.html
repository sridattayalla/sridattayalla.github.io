<figure class="verse" data-verse="11.12">
<figcaption>Bhagavad Gita 11.12</figcaption>
<blockquote class="iast">divi sūryasahasrasya bhavedyugapadutthitā | yadi bhāḥ sadṛśī sā syādbhāsastasya mahātmanaḥ</blockquote>
<p class="gloss">If the light of a thousand suns were to rise at once in the sky, that might resemble the splendor of that great one.</p>
<p class="note"><strong>Translation note</strong> The verse behind &#x27;brighter than a thousand suns&#x27; — though the exact English phrasing comes from Robert Jungk&#x27;s 1958 retelling of Oppenheimer, not from Oppenheimer&#x27;s own lips at Trinity.</p>
</figure>

<figure class="verse" data-verse="11.28">
<figcaption>Bhagavad Gita 11.28</figcaption>
<blockquote class="iast">yathā nadīnāṃ bahavo&#x27;mbuvegāḥ | samudramevābhimukhā dravanti | tathā tavāmī naralokavīrā | viśanti vaktrāṇyabhivijvalanti</blockquote>
<p class="gloss">As the many streams of rivers run headlong into the ocean, so these heroes of the world of men enter your blazing mouths.</p>
</figure>

<figure class="verse" data-verse="11.32">
<figcaption>Bhagavad Gita 11.32</figcaption>
<blockquote class="iast">kālo&#x27;smi lokakṣayakṛtpravṛddho | lokānsamāhartumiha pravṛttaḥ | ṛte&#x27;pi tvāṃ na bhaviṣyanti sarve | ye&#x27;vasthitāḥ pratyanīkeṣu yodhāḥ</blockquote>
<p class="gloss">I am time, grown great, the destroyer of worlds, set in motion here to gather in the worlds; even without you, none of these warriors in the opposing ranks shall remain.</p>
<p class="note"><strong>Translation note</strong> &#x27;Kāla&#x27; = time, not &#x27;death&#x27; (that is mṛtyu). Oppenheimer&#x27;s &#x27;Now I am become Death&#x27; follows his teacher Ryder&#x27;s rendering. Readings differ on what identifying with &#x27;time&#x27; does to the speaker&#x27;s guilt.</p>
</figure>

<figure class="verse" data-verse="11.33">
<figcaption>Bhagavad Gita 11.33</figcaption>
<blockquote class="iast">tasmāttvamuttiṣṭha yaśo labhasva | jitvā śatrūn bhuṅkṣva rājyaṃ samṛddham | mayaivaite nihatāḥ pūrvameva | nimittamātraṃ bhava savyasācin</blockquote>
<p class="gloss">Therefore rise, win glory; conquering your enemies, enjoy a flourishing kingdom. By me these have already been slain — be you merely the instrument, left-handed archer.</p>
<p class="note"><strong>Translation note</strong> &#x27;Nimitta-mātra&#x27; = mere instrument/occasion. The strongest verse for the &#x27;divine determinism&#x27; reading — and the one Ambedkar called a lunatic&#x27;s defense of murder.</p>
</figure>

<figure class="verse" data-verse="11.53">
<figcaption>Bhagavad Gita 11.53</figcaption>
<blockquote class="iast">nāhaṃ vedairna tapasā na dānena na cejyayā | śakya evaṃvidho draṣṭuṃ dṛṣṭavānasi māṃ yathā</blockquote>
<p class="gloss">Not by the Vedas, nor by austerity, nor by giving, nor by ritual — can I be seen as you have seen me.</p>
</figure>

<figure class="verse" data-verse="11.54">
<figcaption>Bhagavad Gita 11.54</figcaption>
<blockquote class="iast">bhaktyā tvananyayā śakya ahamevaṃvidho&#x27;rjuna | jñātuṃ draṣṭuṃ ca tattvena praveṣṭuṃ ca parantapa</blockquote>
<p class="gloss">By unwavering devotion alone can I be known in this way, Arjuna — seen in truth, entered into.</p>
</figure>

<figure class="verse" data-verse="11.55">
<figcaption>Bhagavad Gita 11.55</figcaption>
<blockquote class="iast">matkarmakṛnmatparamo madbhaktaḥ saṅgavarjitaḥ | nirvairaḥ sarvabhūteṣu yaḥ sa māmeti pāṇḍava</blockquote>
<p class="gloss">Who works for me, holds me supreme, is devoted to me, free of attachment, bearing no enmity toward any being — that one comes to me, Pandava.</p>
</figure>
