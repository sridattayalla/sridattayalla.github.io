<figure class="verse" data-verse="11.32">
<figcaption>Bhagavad Gita 11.32</figcaption>
<blockquote class="iast">kālo&#x27;smi lokakṣayakṛtpravṛddho | lokānsamāhartumiha pravṛttaḥ | ṛte&#x27;pi tvāṃ na bhaviṣyanti sarve | ye&#x27;vasthitāḥ pratyanīkeṣu yodhāḥ</blockquote>
<p class="gloss">I am time, grown great, the destroyer of worlds, set in motion here to gather in the worlds; even without you, none of these warriors in the opposing ranks shall remain.</p>
<p class="note"><strong>Translation note</strong> &#x27;Kāla&#x27; = time, not &#x27;death&#x27; (that is mṛtyu). Oppenheimer&#x27;s &#x27;Now I am become Death&#x27; follows his teacher Ryder&#x27;s rendering. Readings differ on what identifying with &#x27;time&#x27; does to the speaker&#x27;s guilt.</p>
</figure>
