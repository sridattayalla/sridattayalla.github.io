<figure class="verse" data-verse="6.17">
<figcaption>Bhagavad Gita 6.17</figcaption>
<blockquote class="iast">yuktāhāravihārasya yuktaceṣṭasya karmasu | yuktasvapnāvabodhasya yogo bhavati duḥkhahā</blockquote>
<p class="gloss">For one measured in eating and in recreation, measured in effort, measured in sleeping and waking — yoga becomes the destroyer of sorrow.</p>
<p class="note"><strong>Translation note</strong> The &#x27;moderation verse&#x27; — often quoted as the Gita&#x27;s middle way, echoing Buddhist phrasing.</p>
</figure>
