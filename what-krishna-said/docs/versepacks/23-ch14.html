<figure class="verse" data-verse="14.5">
<figcaption>Bhagavad Gita 14.5</figcaption>
<blockquote class="iast">sattvaṃ rajastama iti guṇāḥ prakṛtisambhavāḥ | nibadhnanti mahābāho dehe dehinamavyayam</blockquote>
<p class="gloss">Strand-lucidity, passion and inertia — these strands, born of nature, bind the embodied one, the imperishable, fast in the body.</p>
</figure>

<figure class="verse" data-verse="14.6">
<figcaption>Bhagavad Gita 14.6</figcaption>
<blockquote class="iast">tatra sattvaṃ nirmalatvātprakāśakamanāmayam | sukhasaṅgena badhnāti jñānasaṅgena cānagha</blockquote>
<p class="gloss">Of these, lucidity — stainless, luminous, unailing — binds through attachment to happiness and to knowledge.</p>
</figure>

<figure class="verse" data-verse="14.7">
<figcaption>Bhagavad Gita 14.7</figcaption>
<blockquote class="iast">rajo rāgātmakaṃ viddhi tṛṣṇāsaṅgasamudbhavam | tannibadhnāti kaunteya karmasaṅgena dehinam</blockquote>
<p class="gloss">Know passion as born of desire, attachment-bred; it binds the embodied one, son of Kunti, by attachment to action.</p>
</figure>

<figure class="verse" data-verse="14.8">
<figcaption>Bhagavad Gita 14.8</figcaption>
<blockquote class="iast">tamastvajñānajaṃ viddhi mohanaṃ sarvadehinām | pramādālasyanidrābhistannibadhnāti bhārata</blockquote>
<p class="gloss">And know inertia as born of ignorance, bewildering all embodied beings; it binds through heedlessness, sloth and sleep.</p>
</figure>

<figure class="verse" data-verse="14.19">
<figcaption>Bhagavad Gita 14.19</figcaption>
<blockquote class="iast">nānyaṃ guṇebhyaḥ kartāraṃ yadā draṣṭānupaśyati | guṇebhyaśca paraṃ vetti madbhāvaṃ so&#x27;dhigacchati</blockquote>
<p class="gloss">When the seer sees no doer apart from the strands, and knows what is beyond the strands — that one reaches my being.</p>
<p class="note"><strong>Translation note</strong> The mechanistic fork: if the strands do everything, where is free will? Chapter 14&#x27;s determinism is the text&#x27;s sharpest.</p>
</figure>

<figure class="verse" data-verse="14.26">
<figcaption>Bhagavad Gita 14.26</figcaption>
<blockquote class="iast">māṃ ca yo&#x27;vyabhicāreṇa bhaktiyogena sevate | sa guṇānsamatītyaitānbrahmabhūyāya kalpate</blockquote>
<p class="gloss">And whoever serves me with unwavering devotion — that one crosses beyond these strands and is made fit for brahman.</p>
</figure>
