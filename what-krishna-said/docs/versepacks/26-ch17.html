<figure class="verse" data-verse="17.3">
<figcaption>Bhagavad Gita 17.3</figcaption>
<blockquote class="iast">sattvānurūpā sarvasya śraddhā bhavati bhārata | śraddhāmayo&#x27;yaṃ puruṣo yo yacchraddhaḥ sa eva saḥ</blockquote>
<p class="gloss">The faith of each follows its strand; this person is made of faith: whatever one&#x27;s faith, that is what one is.</p>
</figure>

<figure class="verse" data-verse="17.8">
<figcaption>Bhagavad Gita 17.8</figcaption>
<blockquote class="iast">āyuḥsattvabalārogyasukhaprītivivardhanāḥ | rasyāḥ snigdhāḥ sthirā hṛdyā āhārāḥ sāttvikapriyāḥ</blockquote>
<p class="gloss">Foods that grow life, lucidity, strength, health, gladness, cheer — juicy, unctuous, substantial, agreeable — are dear to the lucid.</p>
<p class="note"><strong>Translation note</strong> The verse behind generations of vegetarian sattvic-diet claims.</p>
</figure>

<figure class="verse" data-verse="17.9">
<figcaption>Bhagavad Gita 17.9</figcaption>
<blockquote class="iast">kaṭvamlalavaṇātyuṣṇatīkṣṇarūkṣavidāhinaḥ | āhārā rājasasyeṣṭā duḥkhaśokāmayapradāḥ</blockquote>
<p class="gloss">Foods too bitter, sour, salty, hot, pungent, dry, burning — dear to the passionate — breed pain, grief, sickness.</p>
</figure>

<figure class="verse" data-verse="17.10">
<figcaption>Bhagavad Gita 17.10</figcaption>
<blockquote class="iast">yātayāmaṃ gatarasaṃ pūti paryuṣitaṃ ca yat | ucchiṣṭamapi cāmedhyaṃ bhojanaṃ tāmasapriyam</blockquote>
<p class="gloss">Food stale, tasteless, putrid, left overnight, leavings, unfit for offering — is dear to the inert.</p>
</figure>

<figure class="verse" data-verse="17.15">
<figcaption>Bhagavad Gita 17.15</figcaption>
<blockquote class="iast">anudvegakaraṃ vākyaṃ satyaṃ priyahitaṃ ca yat | svādhyāyābhyasanaṃ caiva vāṅmayaṃ tapa ucyate</blockquote>
<p class="gloss">Speech that gives no offense, that is true, pleasing and beneficial — and the practice of reciting scripture — this is called the austerity of speech.</p>
</figure>

<figure class="verse" data-verse="17.23">
<figcaption>Bhagavad Gita 17.23</figcaption>
<blockquote class="iast">oṃtatsaditi nirdeśo brahmaṇastrividhaḥ smṛtaḥ | brāhmaṇāstena vedāśca yajñāśca vihitāḥ purā</blockquote>
<p class="gloss">&#x27;Oṃ Tat Sat&#x27; — this is held to be the threefold designation of brahman; by this were of old marked the brahmins, the Vedas and the sacrifices.</p>
</figure>
