<figure class="verse" data-verse="2.39">
<figcaption>Bhagavad Gita 2.39</figcaption>
<blockquote class="iast">eṣā te&#x27;bhihitā sāṅkhye buddhiryoge tvimāṃ śṛṇu | buddhyā yukto yayā pārtha karmabandhaṃ prahāsyasi</blockquote>
<p class="gloss">This much has been set out by way of analysis; now hear it in yoga: yoked by this understanding, Partha, you will cast off the bond of action.</p>
<p class="note"><strong>Translation note</strong> &#x27;Sāṅkhya&#x27; here means analysis/discipline of knowledge; &#x27;buddhi-yoga&#x27; the disciplined intelligence applied to action.</p>
</figure>

<figure class="verse" data-verse="2.47">
<figcaption>Bhagavad Gita 2.47</figcaption>
<blockquote class="iast">karmaṇyevādhikāraste mā phaleṣu kadācana | mā karmaphalaheturbhūrmā te saṅgo&#x27;stvakarmaṇi</blockquote>
<p class="gloss">Your right is to the action alone, never to its fruits; do not let the fruits be your motive; neither let there be attachment to inaction.</p>
<p class="note"><strong>Translation note</strong> The most translated verse of the Gita. &#x27;Adhikāra&#x27; = right/claim/jurisdiction; &#x27;phala-hetu&#x27; = cause/reason-in-the-fruit. Whether this counsels detachment from outcome, selfless service, devotional service, or psychological non-clutching is the fork the whole book turns on.</p>
</figure>

<figure class="verse" data-verse="2.48">
<figcaption>Bhagavad Gita 2.48</figcaption>
<blockquote class="iast">yogasthaḥ kuru karmāṇi saṅgaṃ tyaktvā dhanañjaya | siddhyasiddhyoḥ samo bhūtvā samatvaṃ yoga ucyate</blockquote>
<p class="gloss">Established in yoga, do your work, letting go of attachment, Dhanañjaya; even in success and failure — that evenness is called yoga.</p>
</figure>

<figure class="verse" data-verse="2.54">
<figcaption>Bhagavad Gita 2.54</figcaption>
<blockquote class="iast">sthitaprajñasya kā bhāṣā samādhisthasya keśava | sthitadhīḥ kiṃ prabhāṣeta kimāsīta vrajeta kim</blockquote>
<p class="gloss">Arjuna: What is the description of the one of steady wisdom, of the one stable in absorption? How does the settled one speak, sit, walk about?</p>
</figure>

<figure class="verse" data-verse="2.55">
<figcaption>Bhagavad Gita 2.55</figcaption>
<blockquote class="iast">prajahāti yadā kāmānsarvānpārtha manogatān | ātmanyevātmanā tuṣṭaḥ sthitaprajñastadocyate</blockquote>
<p class="gloss">Krishna: When he casts off all the desires of the mind, content in the self alone through the self, he is said to be of steady wisdom.</p>
</figure>

<figure class="verse" data-verse="2.62">
<figcaption>Bhagavad Gita 2.62</figcaption>
<blockquote class="iast">dhyāyato viṣayānpuṃsaḥ saṅgasteṣūpajāyate | saṅgātsañjāyate kāmaḥ kāmātkrodho&#x27;bhijāyate</blockquote>
<p class="gloss">In one who broods on sense-objects, attachment to them is born; from attachment, desire is born; from desire, anger is born.</p>
<p class="note"><strong>Translation note</strong> The Gita&#x27;s causal chain of moral failure: attention → attachment → desire → anger. It is quoted in management and psychology writing as much as in theology.</p>
</figure>

<figure class="verse" data-verse="2.63">
<figcaption>Bhagavad Gita 2.63</figcaption>
<blockquote class="iast">krodhādbhavati sammohaḥ sammohātsmṛtivibhramaḥ | smṛtibhraṃśād buddhināśo buddhināśātpraṇaśyati</blockquote>
<p class="gloss">From anger comes delusion; from delusion, loss of memory; from lost memory, the ruin of discernment; with discernment ruined, he is destroyed.</p>
</figure>

<figure class="verse" data-verse="2.70">
<figcaption>Bhagavad Gita 2.70</figcaption>
<blockquote class="iast">āpūryamāṇamacalapratiṣṭhaṃ | samudramāpaḥ praviśanti yadvat | tadvatkāmā yaṃ praviśanti sarve | sa śāntimāpnoti na kāmakāmī</blockquote>
<p class="gloss">As the waters enter a full, unmoving sea from every side, so into such a one all desires enter — he attains peace, not the desire-chaser.</p>
</figure>

<figure class="verse" data-verse="2.72">
<figcaption>Bhagavad Gita 2.72</figcaption>
<blockquote class="iast">eṣā brāhmī sthitiḥ pārtha naināṃ prāpya vimuhyati | sthitvāsyāmantakāle&#x27;pi brahmanirvāṇamṛcchati</blockquote>
<p class="gloss">This is the state established in brahman, Partha; having reached it, one is not deluded; established in it even at the hour of death, one attains nirvana in brahman.</p>
<p class="note"><strong>Translation note</strong> The Gita uses the Buddhist term &#x27;nirvāṇa&#x27; here — one thread in the debate about its relation to Buddhist thought.</p>
</figure>
