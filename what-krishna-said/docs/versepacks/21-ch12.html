<figure class="verse" data-verse="12.2">
<figcaption>Bhagavad Gita 12.2</figcaption>
<blockquote class="iast">mayyāveśya mano ye māṃ nityayuktā upāsate | śraddhayā parayopetāḥ te me yuktatamā matāḥ</blockquote>
<p class="gloss">Those who set their minds on me, ever-yoked, worshipping with supreme faith — them I hold the highest.</p>
</figure>

<figure class="verse" data-verse="12.5">
<figcaption>Bhagavad Gita 12.5</figcaption>
<blockquote class="iast">kleśo&#x27;dhikatarasteṣāmavyaktāsaktacetasām | avyaktā hi gatirduḥkhaṃ dehavadbhiravāpyate</blockquote>
<p class="gloss">For those attached to the unmanifest, the struggle is greater; the way of the unmanifest is hard for the embodied to attain.</p>
</figure>

<figure class="verse" data-verse="12.13">
<figcaption>Bhagavad Gita 12.13</figcaption>
<blockquote class="iast">adveṣṭā sarvabhūtānāṃ maitraḥ karuṇa eva ca | nirmamo nirahaṅkāraḥ samaduḥkhasukhaḥ kṣamī</blockquote>
<p class="gloss">Free of ill-will toward all beings, friendly, compassionate; without possessiveness, without ego; even in pain and pleasure, patient.</p>
</figure>

<figure class="verse" data-verse="12.14">
<figcaption>Bhagavad Gita 12.14</figcaption>
<blockquote class="iast">santuṣṭaḥ satataṃ yogī yatātmā dṛḍhaniścayaḥ | mayyarpitamanobuddhiryo madbhaktaḥ sa me priyaḥ</blockquote>
<p class="gloss">Content, ever a yogi, self-possessed, firm of resolve; with mind and understanding offered to me — my devotee, dear to me.</p>
</figure>

<figure class="verse" data-verse="12.15">
<figcaption>Bhagavad Gita 12.15</figcaption>
<blockquote class="iast">yasmānnodvijate loko lokānnodvijate ca yaḥ | harṣāmarṣabhayodvegairmukto yaḥ sa ca me priyaḥ</blockquote>
<p class="gloss">He from whom the world is not disturbed, and who is not disturbed by the world; freed from delight, envy, fear and dread — dear to me.</p>
</figure>

<figure class="verse" data-verse="12.16">
<figcaption>Bhagavad Gita 12.16</figcaption>
<blockquote class="iast">anapekṣaḥ śucirdakṣa udāsīno gatavyathaḥ | sarvārambhaparityāgī yo madbhaktaḥ sa me priyaḥ</blockquote>
<p class="gloss">Asking nothing, pure, capable, indifferent, untroubled, letting go of every undertaking — my devotee, dear to me.</p>
</figure>
