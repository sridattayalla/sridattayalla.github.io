<figure class="verse" data-verse="16.1">
<figcaption>Bhagavad Gita 16.1</figcaption>
<blockquote class="iast">abhayaṃ sattvasaṃśuddhirjñānayogavyavasthitiḥ | dānaṃ damaśca yajñaśca svādhyāyastapa ārjavam</blockquote>
<p class="gloss">Fearlessness, purity of one&#x27;s being, steadfastness in the yoga of knowledge; giving, self-restraint, sacrifice, recitation, austerity, uprightness.</p>
</figure>

<figure class="verse" data-verse="16.2">
<figcaption>Bhagavad Gita 16.2</figcaption>
<blockquote class="iast">ahiṃsā satyamakrodhastyāgaḥ śāntirapaiśunam | dayā bhūteṣvaloluptvaṃ mārdavaṃ hrīracāpalam</blockquote>
<p class="gloss">Non-injury, truth, absence of anger, relinquishing, calm, non-slander; compassion for beings, freedom from craving, gentleness, modesty, steadiness.</p>
</figure>

<figure class="verse" data-verse="16.3">
<figcaption>Bhagavad Gita 16.3</figcaption>
<blockquote class="iast">tejaḥ kṣamā dhṛtiḥ śaucamadroho nātimānitā | bhavanti sampadaṃ daivīmabhijātasya bhārata</blockquote>
<p class="gloss">Vigor, forgiveness, fortitude, purity, freedom from envy, absence of pride — these are of one born to the divine estate.</p>
</figure>

<figure class="verse" data-verse="16.4">
<figcaption>Bhagavad Gita 16.4</figcaption>
<blockquote class="iast">dambho darpo&#x27;bhimānaśca krodhaḥ pāruṣyameva ca | ajñānaṃ cābhijātasya pārtha sampadamāsurīm</blockquote>
<p class="gloss">Ostentation, arrogance, self-conceit, anger, harshness, ignorance — these are of one born to the demonic estate.</p>
</figure>

<figure class="verse" data-verse="16.8">
<figcaption>Bhagavad Gita 16.8</figcaption>
<blockquote class="iast">asatyamapratiṣṭhaṃ te jagadāhuranīśvaram | aparasparasambhūtaṃ kimanyatkāmahaitukam</blockquote>
<p class="gloss">They say the world is unreal, without foundation, without a lord; born of mutual union — of desire alone, without other cause.</p>
<p class="note"><strong>Translation note</strong> The Gita&#x27;s sketch of nihilists — often read as a swipe at materialist (Cārvāka) and some Buddhist schools.</p>
</figure>

<figure class="verse" data-verse="16.13">
<figcaption>Bhagavad Gita 16.13</figcaption>
<blockquote class="iast">idamadya mayā labdhamimaṃ prāpsye manoratham | idamastīdamapi me bhaviṣyati punardhanam</blockquote>
<p class="gloss">&#x27;This I have gained today; this desire I shall fulfill; this much is mine — and this wealth too shall be mine.&#x27;</p>
<p class="note"><strong>Translation note</strong> The Gita ventriloquizes the demonic self — the only place it stages an inner monologue.</p>
</figure>

<figure class="verse" data-verse="16.14">
<figcaption>Bhagavad Gita 16.14</figcaption>
<blockquote class="iast">asau mayā hataḥ śatrurhaniṣye cāparānapi | īśvaro&#x27;hamahaṃ bhogī siddho&#x27;haṃ balavānsukhī</blockquote>
<p class="gloss">&#x27;That enemy has been slain by me; these others too I shall slay. I am lord, I am enjoyer, I am perfected, mighty, happy.&#x27;</p>
</figure>

<figure class="verse" data-verse="16.21">
<figcaption>Bhagavad Gita 16.21</figcaption>
<blockquote class="iast">trividhaṃ narakasyedaṃ dvāraṃ nāśanamātmanaḥ | kāmaḥ krodhastathā lobhastasmādetattrayaṃ tyajet</blockquote>
<p class="gloss">Threefold is the gate of hell, ruinous to the self: desire, anger and greed; therefore let a man abandon these three.</p>
</figure>

<figure class="verse" data-verse="16.23">
<figcaption>Bhagavad Gita 16.23</figcaption>
<blockquote class="iast">yaḥ śāstravidhimutsṛjya vartate kāmakārataḥ | na sa siddhimavāpnoti na sukhaṃ na parāṃ gatim</blockquote>
<p class="gloss">Who, casting off the rule of scripture, acts by whim of desire — attains no perfection, no happiness, no highest way.</p>
</figure>

<figure class="verse" data-verse="16.24">
<figcaption>Bhagavad Gita 16.24</figcaption>
<blockquote class="iast">tasmācchāstraṃ pramāṇaṃ te kāryākāryavyavasthitau | jñātvā śāstravidhānoktaṃ karma kartumihārhasi</blockquote>
<p class="gloss">Therefore, let scripture be your measure for what is to be done and not done; knowing the rule of scripture, act here.</p>
<p class="note"><strong>Translation note</strong> The Gita&#x27;s own statement of textual authority — the verse that makes the commentator&#x27;s job sacred, and the reformer&#x27;s job hard.</p>
</figure>
