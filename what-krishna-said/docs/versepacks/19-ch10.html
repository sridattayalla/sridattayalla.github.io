<figure class="verse" data-verse="10.8">
<figcaption>Bhagavad Gita 10.8</figcaption>
<blockquote class="iast">ahaṃ sarvasya prabhavo mattaḥ sarvaṃ pravartate | iti matvā bhajante māṃ budhā bhāvasamanvitāḥ</blockquote>
<p class="gloss">I am the source of all; from me everything moves onward; knowing this, the wise worship me, moved by feeling.</p>
</figure>

<figure class="verse" data-verse="10.20">
<figcaption>Bhagavad Gita 10.20</figcaption>
<blockquote class="iast">ahamātmā guḍākeśa sarvabhūtāśayasthitaḥ | ahamādiśca madhyaṃ ca bhūtānāmanta eva ca</blockquote>
<p class="gloss">I am the self seated in the hearts of all beings, Gudakesha; I am the beginning and the middle, and the end too of beings.</p>
</figure>

<figure class="verse" data-verse="10.41">
<figcaption>Bhagavad Gita 10.41</figcaption>
<blockquote class="iast">yadyadvibhūtimatsattvaṃ śrīmadūrjitameva vā | tattadevāvagaccha tvaṃ mama tejoṃ&#x27;śasambhavam</blockquote>
<p class="gloss">Whatever being has glory, or beauty, or strength — know it as born of a spark of my splendor.</p>
<p class="note"><strong>Translation note</strong> Oppenheimer&#x27;s &#x27;brighter than a thousand suns&#x27; belongs to this chapter&#x27;s neighborhood (11.12) — radiance as a divine signature.</p>
</figure>
