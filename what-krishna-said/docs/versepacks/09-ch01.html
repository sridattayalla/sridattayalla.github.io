<figure class="verse" data-verse="1.1">
<figcaption>Bhagavad Gita 1.1</figcaption>
<blockquote class="iast">dharmakṣetre kurukṣetre samavetā yuyutsavaḥ | māmakāḥ pāṇḍavāścaiva kimakurvata sañjaya</blockquote>
<p class="gloss">Dhritarashtra: On the field of dharma, the field of the Kurus, gathered and eager to fight — what did my sons and the sons of Pandu do, Sanjaya?</p>
<p class="note"><strong>Translation note</strong> The opening word-pair &#x27;dharmakṣetre kurukṣetre&#x27; is itself read two ways: a literal place name, and a pun — &#x27;the field where dharma is at stake&#x27;.</p>
</figure>

<figure class="verse" data-verse="1.21">
<figcaption>Bhagavad Gita 1.21</figcaption>
<blockquote class="iast">senayorubhayormadhye rathaṃ sthāpaya me&#x27;cyuta</blockquote>
<p class="gloss">Arjuna to Krishna: Position my chariot between the two armies, unfailing one.</p>
</figure>

<figure class="verse" data-verse="1.22">
<figcaption>Bhagavad Gita 1.22</figcaption>
<blockquote class="iast">yāvadetānnirīkṣe&#x27;haṃ yoddhukāmānavasthitān | kairmayā saha yoddhavyamasmin raṇasamudyame</blockquote>
<p class="gloss">So that I may see those who stand here drawn up, longing for the fight, and know whom I am to face in this undertaking.</p>
</figure>

<figure class="verse" data-verse="1.28">
<figcaption>Bhagavad Gita 1.28</figcaption>
<blockquote class="iast">kṛpayā parayāviṣṭo viṣīdannidamabravīt | dṛṣṭvemaṃ svajanaṃ kṛṣṇa yuyutsuṃ samupasthitam</blockquote>
<p class="gloss">Sanjaya: Overwhelmed by great compassion, grieving, he said — Arjuna: seeing these my own people assembled, Krishna, eager for battle...</p>
</figure>

<figure class="verse" data-verse="1.29">
<figcaption>Bhagavad Gita 1.29</figcaption>
<blockquote class="iast">sīdanti mama gātrāṇi mukhaṃ ca pariśuṣyati | vepathuśca śarīre me romaharṣaśca jāyate</blockquote>
<p class="gloss">My limbs sink, my mouth goes dry, my body trembles, my hair stands on end.</p>
</figure>

<figure class="verse" data-verse="1.30">
<figcaption>Bhagavad Gita 1.30</figcaption>
<blockquote class="iast">gāṇḍīvaṃ sraṃsate hastāttvakcaiva paridahyate | na ca śaknomyavasthātuṃ bhramatīva ca me manaḥ</blockquote>
<p class="gloss">The Gandiva bow slips from my hand, my skin burns; I cannot stand steady, and my mind whirls.</p>
</figure>

<figure class="verse" data-verse="1.41">
<figcaption>Bhagavad Gita 1.41</figcaption>
<blockquote class="iast">adharmābhibhavātkṛṣṇa praduṣyanti kulastriyaḥ | strīṣu duṣṭāsu vārṣṇeya jāyate varṇasaṅkaraḥ</blockquote>
<p class="gloss">When lawlessness overwhelms, Krishna, the women of the family are corrupted; and when women are corrupted, Varshneya, mixing of varnas is born.</p>
<p class="note"><strong>Translation note</strong> Arjuna&#x27;s own argument, not Krishna&#x27;s. The social-anxiety logic here (women → lineage purity → varna order) is exactly what later critics such as Ambedkar targeted.</p>
</figure>

<figure class="verse" data-verse="1.42">
<figcaption>Bhagavad Gita 1.42</figcaption>
<blockquote class="iast">saṅkaro narakāyaiva kulaghnānāṃ kulasya ca | patanti pitaro hyeṣāṃ luptapiṇḍodakakriyāḥ</blockquote>
<p class="gloss">That mixing drags down the destroyers of the family and the family itself; their ancestors fall, cut off from the rice-ball and water offerings.</p>
</figure>

<figure class="verse" data-verse="1.47">
<figcaption>Bhagavad Gita 1.47</figcaption>
<blockquote class="iast">evamuktvārjunaḥ saṅkhye rathopastha upāviśat | visṛjya saśaraṃ cāpaṃ śokasaṃvignamānasaḥ</blockquote>
<p class="gloss">Having spoken thus, Arjuna sat down on the chariot seat, casting aside bow and arrows, his mind drowned in sorrow.</p>
</figure>
