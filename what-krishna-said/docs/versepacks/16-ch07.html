<figure class="verse" data-verse="7.5">
<figcaption>Bhagavad Gita 7.5</figcaption>
<blockquote class="iast">apareyamitastvanyāṃ prakṛtiṃ viddhi me parām | jīvabhūtāṃ mahābāho yayedaṃ dhāryate jagat</blockquote>
<p class="gloss">This is my lower nature; know my other, higher nature — the life-element, mighty-armed one, by which this world is held fast.</p>
<p class="note"><strong>Translation note</strong> The Gita&#x27;s two-natures doctrine: matter (apara prakṛti) and life/soul (para prakṛti).</p>
</figure>

<figure class="verse" data-verse="7.14">
<figcaption>Bhagavad Gita 7.14</figcaption>
<blockquote class="iast">daivī hyeṣā guṇamayī mama māyā duratyayā | māmeva ye prapadyante māyāmetāṃ taranti te</blockquote>
<p class="gloss">For divine is this strand-woven māyā of mine, hard to cross; those who take refuge in me alone cross over this māyā.</p>
</figure>

<figure class="verse" data-verse="7.16">
<figcaption>Bhagavad Gita 7.16</figcaption>
<blockquote class="iast">caturvidhā bhajante māṃ janāḥ sukṛtino&#x27;rjuna | ārto jijñāsurarthārthī jñānī ca bharatarṣabha</blockquote>
<p class="gloss">Four kinds of virtuous folk worship me, Arjuna: the distressed, the knowledge-seeker, the wealth-seeker — and the wise.</p>
</figure>

<figure class="verse" data-verse="7.19">
<figcaption>Bhagavad Gita 7.19</figcaption>
<blockquote class="iast">bahūnāṃ janmanāmante jñānavānmāṃ prapadyate | vāsudevaḥ sarvamiti sa mahātmā sudurlabhaḥ</blockquote>
<p class="gloss">At the end of many births, the wise one comes to refuge in me: &#x27;Vasudeva is everything.&#x27; Such a great soul is very rare.</p>
</figure>

<figure class="verse" data-verse="7.21">
<figcaption>Bhagavad Gita 7.21</figcaption>
<blockquote class="iast">yo yo yāṃ yāṃ tanuṃ bhaktaḥ śraddhayārcitumicchati | tasya tasyācalāṃ śraddhāṃ tāmeva vidadhāmyaham</blockquote>
<p class="gloss">Whatever form any devotee wishes to worship in faith — that very faith of theirs I make firm.</p>
<p class="note"><strong>Translation note</strong> The Gita&#x27;s most pluralism-friendly verse: other gods are given a place within Krishna&#x27;s economy.</p>
</figure>

<figure class="verse" data-verse="7.22">
<figcaption>Bhagavad Gita 7.22</figcaption>
<blockquote class="iast">sa tayā śraddhayā yuktastasyārādhanamīhate | labhate ca tataḥ kāmānmayaiva vihitānhi tān</blockquote>
<p class="gloss">Yoked in that faith, such a one seeks the favor of that form — and from it gains the desires wished; the arranging is mine.</p>
</figure>
