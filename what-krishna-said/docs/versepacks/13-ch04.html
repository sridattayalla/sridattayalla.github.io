<figure class="verse" data-verse="4.1">
<figcaption>Bhagavad Gita 4.1</figcaption>
<blockquote class="iast">imaṃ vivasvate yogaṃ proktavānahamavyayam | vivasvānmanave prāha manurikṣvākave&#x27;bravīt</blockquote>
<p class="gloss">I spoke this imperishable yoga to Vivasvan the sun; Vivasvan spoke it to Manu; Manu spoke it to Ikshvaku.</p>
<p class="note"><strong>Translation note</strong> The genealogy frames the Gita as an eternal teaching restored — the verse Bhaktivedanta Swami builds his &#x27;disciplic succession&#x27; reading on.</p>
</figure>

<figure class="verse" data-verse="4.2">
<figcaption>Bhagavad Gita 4.2</figcaption>
<blockquote class="iast">evaṃ paramparāprāptamimaṃ rājarṣayo viduḥ | sa kāleneha mahatā yogo naṣṭaḥ parantapa</blockquote>
<p class="gloss">Thus received down the line, the royal seers knew it; by the great lapse of time this yoga was lost here, burner of foes.</p>
</figure>

<figure class="verse" data-verse="4.6">
<figcaption>Bhagavad Gita 4.6</figcaption>
<blockquote class="iast">ajo&#x27;pi sannavyayātmā bhūtānāmīśvaro&#x27;pi san | prakṛtiṃ svāmadhiṣṭhāya sambhavāmyātmamāyayā</blockquote>
<p class="gloss">Though unborn, of imperishable self, and lord of beings — resting on my own nature I come to be by my own māyā.</p>
<p class="note"><strong>Translation note</strong> &#x27;Māyā&#x27; here means the lord&#x27;s own power of self-manifestation, not (yet) &#x27;illusion&#x27;. Shankara and the Vaishnava schools part ways over this word.</p>
</figure>

<figure class="verse" data-verse="4.7">
<figcaption>Bhagavad Gita 4.7</figcaption>
<blockquote class="iast">yadā yadā hi dharmasya glānirbhavati bhārata | abhyutthānamadharmasya tadātmānaṃ sṛjāmyaham</blockquote>
<p class="gloss">Whenever dharma declines, Bharata, and adharma rises — I bring myself into being.</p>
<p class="note"><strong>Translation note</strong> The avatāra doctrine in two lines. The word &#x27;avatāra&#x27; itself never appears in the Gita; the concept does.</p>
</figure>

<figure class="verse" data-verse="4.8">
<figcaption>Bhagavad Gita 4.8</figcaption>
<blockquote class="iast">paritrāṇāya sādhūnāṃ vināśāya ca duṣkṛtām | dharmasaṃsthāpanārthāya sambhavāmi yuge yuge</blockquote>
<p class="gloss">To shelter the good, to destroy the wicked, to set dharma on its feet — I come into being age after age.</p>
</figure>

<figure class="verse" data-verse="4.13">
<figcaption>Bhagavad Gita 4.13</figcaption>
<blockquote class="iast">cāturvarṇyaṃ mayā sṛṣṭaṃ guṇakarmavibhāgaśaḥ | tasya kartāramapi māṃ viddhyakartāramavyayam</blockquote>
<p class="gloss">The four-varna order I made, according to strand and action; though its maker, know me as non-maker, imperishable.</p>
<p class="note"><strong>Translation note</strong> The fork of forks. &#x27;Guṇa-karma&#x27; = &#x27;by quality and function&#x27; or &#x27;by quality-born action&#x27; — read as anti-birth by some devotee commentators, as divine sanction of hierarchy by critics such as Ambedkar, and as a later interpolation by some historians.</p>
</figure>

<figure class="verse" data-verse="4.34">
<figcaption>Bhagavad Gita 4.34</figcaption>
<blockquote class="iast">tadviddhi praṇipātena paripraśnena sevayā | upadekṣyanti te jñānaṃ jñāninastattvadarśinaḥ</blockquote>
<p class="gloss">Know this by bowing, by asking, by serving; those who see the real will teach you knowledge.</p>
<p class="note"><strong>Translation note</strong> The Gita&#x27;s teacher-verse: prostration, inquiry, service — claimed by every guru-led tradition.</p>
</figure>

<figure class="verse" data-verse="4.37">
<figcaption>Bhagavad Gita 4.37</figcaption>
<blockquote class="iast">yathaidhāṃsi samiddho&#x27;gnirbhasmasātkurute&#x27;rjuna | jñānāgniḥ sarvakarmāṇi bhasmasātkurute tathā</blockquote>
<p class="gloss">As a fire well-lit turns kindling to ash, Arjuna, so the fire of knowledge turns all actions to ash.</p>
</figure>

<figure class="verse" data-verse="4.38">
<figcaption>Bhagavad Gita 4.38</figcaption>
<blockquote class="iast">na hi jñānena sadṛśaṃ pavitramiha vidyate | tatsvayaṃ yogasaṃsiddhaḥ kālenātmani vindati</blockquote>
<p class="gloss">Nothing that purifies equals knowledge; perfected in yoga, one finds it in oneself in time.</p>
</figure>
