<figure class="verse" data-verse="3.5">
<figcaption>Bhagavad Gita 3.5</figcaption>
<blockquote class="iast">na hi kaścitkṣaṇamapi jātu tiṣṭhatyakarmakṛt | kāryate hyavaśaḥ karma sarvaḥ prakṛtijairguṇaiḥ</blockquote>
<p class="gloss">No one rests even for a moment without acting; all beings are made to act by the strands born of nature.</p>
</figure>

<figure class="verse" data-verse="3.9">
<figcaption>Bhagavad Gita 3.9</figcaption>
<blockquote class="iast">yajñārthātkarmaṇo&#x27;nyatra loko&#x27;yaṃ karmabandhanaḥ | tadarthaṃ karma kaunteya muktasaṅgaḥ samācara</blockquote>
<p class="gloss">Action other than for sacrifice binds this world; acting for that end, be free of attachment, son of Kunti.</p>
<p class="note"><strong>Translation note</strong> &#x27;Yajña&#x27; (sacrifice/offering) is reinterpreted through the Gita from ritual offering to dedicated, other-regarding action.</p>
</figure>

<figure class="verse" data-verse="3.19">
<figcaption>Bhagavad Gita 3.19</figcaption>
<blockquote class="iast">tasmādasaktaḥ satataṃ kāryaṃ karma samācara | asakto hyācarankarma paramāpnoti pūruṣaḥ</blockquote>
<p class="gloss">Therefore, unattached, always do what work is to be done; the unattached one doing work attains the highest.</p>
</figure>

<figure class="verse" data-verse="3.27">
<figcaption>Bhagavad Gita 3.27</figcaption>
<blockquote class="iast">prakṛteḥ kriyamāṇāni guṇaiḥ karmāṇi sarvaśaḥ | ahaṅkāravimūḍhātmā kartāhamiti manyate</blockquote>
<p class="gloss">All actions are performed by the strands of nature in every way; one deluded by ego thinks, &#x27;I am the doer.&#x27;</p>
</figure>

<figure class="verse" data-verse="3.35">
<figcaption>Bhagavad Gita 3.35</figcaption>
<blockquote class="iast">śreyānsvadharmo viguṇaḥ paradharmātsvanuṣṭhitāt | svadharme nidhanaṃ śreyaḥ paradharmo bhayāvahaḥ</blockquote>
<p class="gloss">Better is one&#x27;s own duty though flawed, than another&#x27;s duty well done; better is death in one&#x27;s own duty — another&#x27;s duty is full of fear.</p>
<p class="note"><strong>Translation note</strong> With 18.47, the most socially consequential verse of the Gita: read as vocational integrity by some, as birth-duty apologetics by others.</p>
</figure>

<figure class="verse" data-verse="3.37">
<figcaption>Bhagavad Gita 3.37</figcaption>
<blockquote class="iast">kāma eṣa krodha eṣa rajoguṇasamudbhavaḥ | mahāśano mahāpāpmā viddhyenamiha vairiṇam</blockquote>
<p class="gloss">It is desire, it is anger, born of the strand of passion, all-devouring, most impure — know this here as the enemy.</p>
</figure>

<figure class="verse" data-verse="3.42">
<figcaption>Bhagavad Gita 3.42</figcaption>
<blockquote class="iast">indriyāṇi parāṇyāhurindriyebhyaḥ paraṃ manaḥ | manasastu parā buddhiryo buddheḥ paratastu saḥ</blockquote>
<p class="gloss">The senses, they say, are higher than the body; higher than the senses, the mind; higher than the mind, discernment; and higher than discernment, that.</p>
<p class="note"><strong>Translation note</strong> The last &#x27;that&#x27; (saḥ) is read as the self or as the lord, depending on the commentator.</p>
</figure>

<figure class="verse" data-verse="3.43">
<figcaption>Bhagavad Gita 3.43</figcaption>
<blockquote class="iast">evaṃ buddheḥ paraṃ buddhvā saṃstabhyātmānamātmanā | jahi śatruṃ mahābāho kāmarūpaṃ durāsadam</blockquote>
<p class="gloss">Thus knowing it as higher than discernment, steadying the self by the self, strike down this enemy in the form of desire, so hard to master, mighty-armed one.</p>
</figure>
