<figcaption>Bhagavad Gita 13.2</figcaption>
<blockquote class="iast">idaṃ śarīraṃ kaunteya kṣetramityabhidhīyate | etadyo vetti taṃ prāhuḥ kṣetrajña iti tadvidaḥ</blockquote>
<p class="gloss">Krishna: This body is called the field, son of Kunti; and the one who knows it — those who know call that one the knower of the field.</p>
