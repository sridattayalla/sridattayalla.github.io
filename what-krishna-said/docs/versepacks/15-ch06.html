<figure class="verse" data-verse="6.5">
<figcaption>Bhagavad Gita 6.5</figcaption>
<blockquote class="iast">uddharedātmanātmānaṃ nātmānamavasādayet | ātmaiva hyātmano bandhurātmaiva ripurātmanaḥ</blockquote>
<p class="gloss">Let a man lift himself by himself; let him not degrade himself; the self alone is the self&#x27;s friend, the self alone its enemy.</p>
<p class="note"><strong>Translation note</strong> One of the Gita&#x27;s most-quoted self-reliance verses — &#x27;uddhared ātmanātmānam&#x27;.</p>
</figure>

<figure class="verse" data-verse="6.16">
<figcaption>Bhagavad Gita 6.16</figcaption>
<blockquote class="iast">nātyaśnatastu yogo&#x27;sti na caikāntamanaśnataḥ | na cātisvapnaśīlasya jāgrato naiva cārjuna</blockquote>
<p class="gloss">Yoga is not for one who overeats, Arjuna, nor for one who does not eat at all; nor for one who oversleeps, nor for one who keeps awake.</p>
</figure>

<figure class="verse" data-verse="6.17">
<figcaption>Bhagavad Gita 6.17</figcaption>
<blockquote class="iast">yuktāhāravihārasya yuktaceṣṭasya karmasu | yuktasvapnāvabodhasya yogo bhavati duḥkhahā</blockquote>
<p class="gloss">For one measured in eating and in recreation, measured in effort, measured in sleeping and waking — yoga becomes the destroyer of sorrow.</p>
<p class="note"><strong>Translation note</strong> The &#x27;moderation verse&#x27; — often quoted as the Gita&#x27;s middle way, echoing Buddhist phrasing.</p>
</figure>

<figure class="verse" data-verse="6.19">
<figcaption>Bhagavad Gita 6.19</figcaption>
<blockquote class="iast">yathā dīpo nivātastho neṅgate sopamā smṛtā | yogino yatacittasya yuñjato yogamātmanaḥ</blockquote>
<p class="gloss">As a lamp in a windless place does not flicker — so runs the likeness of the yogi of subdued mind, practicing yoga of the self.</p>
</figure>

<figure class="verse" data-verse="6.34">
<figcaption>Bhagavad Gita 6.34</figcaption>
<blockquote class="iast">cañcalaṃ hi manaḥ kṛṣṇa pramāthi balavad dṛḍham | tasyāhaṃ nigrahaṃ manye vāyoriva suduṣkaram</blockquote>
<p class="gloss">Arjuna: The mind is restless, Krishna — turbulent, powerful, obstinate; to curb it seems to me as hard as to curb the wind.</p>
</figure>

<figure class="verse" data-verse="6.35">
<figcaption>Bhagavad Gita 6.35</figcaption>
<blockquote class="iast">asaṃśayaṃ mahābāho mano durnigrahaṃ calam | abhyāsena tu kaunteya vairāgyeṇa ca gṛhyate</blockquote>
<p class="gloss">Krishna: No doubt, mighty-armed one — the mind is restless and hard to curb; yet by practice and by non-attachment, son of Kunti, it is held.</p>
</figure>

<figure class="verse" data-verse="6.47">
<figcaption>Bhagavad Gita 6.47</figcaption>
<blockquote class="iast">yogināmapi sarveṣāṃ madgatenāntarātmanā | śraddhāvānbhajate yo māṃ sa me yuktatamo mataḥ</blockquote>
<p class="gloss">And of all yogis, the one who worships me with faith, his self absorbed in me — that one I hold the most yoked of all.</p>
<p class="note"><strong>Translation note</strong> Chapter 6, devoted to meditation, ends by ranking the devotee above the meditator — a hinge toward the devotion chapters.</p>
</figure>
