<figure class="verse" data-verse="11.33">
<figcaption>Bhagavad Gita 11.33</figcaption>
<blockquote class="iast">tasmāttvamuttiṣṭha yaśo labhasva | jitvā śatrūn bhuṅkṣva rājyaṃ samṛddham | mayaivaite nihatāḥ pūrvameva | nimittamātraṃ bhava savyasācin</blockquote>
<p class="gloss">Therefore rise, win glory; conquering your enemies, enjoy a flourishing kingdom. By me these have already been slain — be you merely the instrument, left-handed archer.</p>
<p class="note"><strong>Translation note</strong> &#x27;Nimitta-mātra&#x27; = mere instrument/occasion. The strongest verse for the &#x27;divine determinism&#x27; reading — and the one Ambedkar called a lunatic&#x27;s defense of murder.</p>
</figure>

<figure class="verse" data-verse="18.61">
<figcaption>Bhagavad Gita 18.61</figcaption>
<blockquote class="iast">īśvaraḥ sarvabhūtānāṃ hṛddeśe&#x27;rjuna tiṣṭhati | bhrāmayansarvabhūtāni yantrārūḍhāni māyayā</blockquote>
<p class="gloss">The lord dwells in the hearts of all beings, Arjuna, whirling all beings, seated as if on a machine, by his māyā.</p>
<p class="note"><strong>Translation note</strong> The machine image (yantra) — determinism&#x27;s sharpest image in the Gita; the verses after it pivot immediately to refuge as the exit.</p>
</figure>

<figure class="verse" data-verse="5.18">
<figcaption>Bhagavad Gita 5.18</figcaption>
<blockquote class="iast">vidyāvinayasampanne brāhmaṇe gavi hastini | śuni caiva śvapāke ca paṇḍitāḥ samadarśinaḥ</blockquote>
<p class="gloss">The learned see the same in a brahmin of learning and courtesy, in a cow, in an elephant, in a dog — and in a dog-cooker.</p>
<p class="note"><strong>Translation note</strong> &#x27;Śvapāka&#x27; literally &#x27;dog-cooker&#x27;, an outcaste occupation. The verse&#x27;s radical equality claim coexists in the same text with 4.13 and 18.41 — a tension every reader must place somewhere.</p>
</figure>
