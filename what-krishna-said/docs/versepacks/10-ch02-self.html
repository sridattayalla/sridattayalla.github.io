<figure class="verse" data-verse="2.11">
<figcaption>Bhagavad Gita 2.11</figcaption>
<blockquote class="iast">aśocyānanvaśocastvaṃ prajñāvādāṃśca bhāṣase | gatāsūnagatāsūṃśca nānuśocanti paṇḍitāḥ</blockquote>
<p class="gloss">Krishna: You grieve for what deserves no grief, and speak what sounds like wisdom; the truly learned grieve neither for the living nor for the dead.</p>
</figure>

<figure class="verse" data-verse="2.13">
<figcaption>Bhagavad Gita 2.13</figcaption>
<blockquote class="iast">dehino&#x27;sminyathā dehe kaumāraṃ yauvanaṃ jarā | tathā dehāntaraprāptirdhīrastatra na muhyati</blockquote>
<p class="gloss">As the embodied one passes through childhood, youth and old age in this body, so it passes on to another body; the composed one is not misled by this.</p>
</figure>

<figure class="verse" data-verse="2.20">
<figcaption>Bhagavad Gita 2.20</figcaption>
<blockquote class="iast">na jāyate mriyate vā kadācin | nāyaṃ bhūtvā bhavitā vā na bhūyaḥ | ajo nityaḥ śāśvato&#x27;yaṃ purāṇo | na hanyate hanyamāne śarīre</blockquote>
<p class="gloss">It is never born, nor does it ever die; having once been, it never ceases to be — unborn, eternal, everlasting, primeval, it is not killed when the body is killed.</p>
<p class="note"><strong>Translation note</strong> The Gita&#x27;s most quoted statement of the self. It assumes rebirth as background, not as something to prove.</p>
</figure>

<figure class="verse" data-verse="2.22">
<figcaption>Bhagavad Gita 2.22</figcaption>
<blockquote class="iast">vāsāṃsi jīrṇāni yathā vihāya | navāni gṛhṇāti naro&#x27;parāṇi | tathā śarīrāṇi vihāya jīrṇā- | nyanyāni saṃyāti navāni dehī</blockquote>
<p class="gloss">As a man casts off worn-out garments and puts on new ones, so the embodied one casts off worn-out bodies and takes up others that are new.</p>
</figure>

<figure class="verse" data-verse="2.23">
<figcaption>Bhagavad Gita 2.23</figcaption>
<blockquote class="iast">nainaṃ chindanti śastrāṇi nainaṃ dahati pāvakaḥ | na cainaṃ kledayantyāpo na śoṣayati mārutaḥ</blockquote>
<p class="gloss">Weapons do not cut it; fire does not burn it; waters do not wet it; wind does not wither it.</p>
</figure>

<figure class="verse" data-verse="2.27">
<figcaption>Bhagavad Gita 2.27</figcaption>
<blockquote class="iast">jātasya hi dhruvo mṛtyurdhruvaṃ janma mṛtasya ca | tasmādaparihārye&#x27;rthe na tvaṃ śocitumarhasi</blockquote>
<p class="gloss">For one who is born, death is certain; for one who is dead, birth is certain; over this, which cannot be otherwise, you should not grieve.</p>
</figure>

<figure class="verse" data-verse="2.31">
<figcaption>Bhagavad Gita 2.31</figcaption>
<blockquote class="iast">svadharmamapi cāvekṣya na vikampitumarhasi | dharmyāddhi yuddhācchreyo&#x27;nyatkṣatriyasya na vidyate</blockquote>
<p class="gloss">And as regards your own duty, you should not waver: for a kshatriya there is nothing better than a battle lawful by dharma.</p>
<p class="note"><strong>Translation note</strong> The chapter pivots here from the metaphysics of the self to the argument from warrior duty — svadharma.</p>
</figure>

<figure class="verse" data-verse="2.32">
<figcaption>Bhagavad Gita 2.32</figcaption>
<blockquote class="iast">yadṛcchayā copapannaṃ svargadvāramapāvṛtam | sukhinaḥ kṣatriyāḥ pārtha labhante yuddhamīdṛśam</blockquote>
<p class="gloss">Kshatriyas who meet with such a battle, Partha, a chance-opened gate of heaven, are the fortunate ones.</p>
</figure>

<figure class="verse" data-verse="2.37">
<figcaption>Bhagavad Gita 2.37</figcaption>
<blockquote class="iast">hato vā prāpsyasi svargaṃ jitvā vā bhokṣyase mahīm | tasmāduttiṣṭha kaunteya yuddhāya kṛtaniścayaḥ</blockquote>
<p class="gloss">Slain — you will win heaven; victorious — you will enjoy the earth. Rise therefore, son of Kunti, your mind made up to fight.</p>
</figure>

<figure class="verse" data-verse="2.38">
<figcaption>Bhagavad Gita 2.38</figcaption>
<blockquote class="iast">sukhaduḥkhe same kṛtvā lābhālābhau jayājayau | tato yuddhāya yujyasva naivaṃ pāpamavāpsyasi</blockquote>
<p class="gloss">Making pleasure and pain the same, gain and loss, victory and defeat — gird for battle then; so you will incur no wrong.</p>
<p class="note"><strong>Translation note</strong> &#x27;Pāpam&#x27; here ranges from &#x27;sin&#x27; to &#x27;wrong&#x27; to &#x27;misfortune&#x27;; translations differ.</p>
</figure>
