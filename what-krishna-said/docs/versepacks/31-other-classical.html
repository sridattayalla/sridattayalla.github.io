<figure class="verse" data-verse="6.47">
<figcaption>Bhagavad Gita 6.47</figcaption>
<blockquote class="iast">yogināmapi sarveṣāṃ madgatenāntarātmanā | śraddhāvānbhajate yo māṃ sa me yuktatamo mataḥ</blockquote>
<p class="gloss">And of all yogis, the one who worships me with faith, his self absorbed in me — that one I hold the most yoked of all.</p>
<p class="note"><strong>Translation note</strong> Chapter 6, devoted to meditation, ends by ranking the devotee above the meditator — a hinge toward the devotion chapters.</p>
</figure>
