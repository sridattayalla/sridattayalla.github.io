<figure class="verse" data-verse="15.1">
<figcaption>Bhagavad Gita 15.1</figcaption>
<blockquote class="iast">ūrdhvamūlamadhaḥśākhamaśvatthaṃ prāhuravyayam | chandāṃsi yasya parṇāni yastaṃ veda sa vedavit</blockquote>
<p class="gloss">They speak of an imperishable banyan, roots above, branches below, whose leaves are the Vedic hymns; who knows it, knows the Vedas.</p>
<p class="note"><strong>Translation note</strong> &#x27;Aśvattha&#x27; = the banyan/peepul fig — &#x27;that which will not stand the same till tomorrow&#x27;, an etymology the tradition savors.</p>
</figure>

<figure class="verse" data-verse="15.2">
<figcaption>Bhagavad Gita 15.2</figcaption>
<blockquote class="iast">adhaścordhvaṃ prasṛtāstasya śākhā | guṇapravṛddhā viṣayapravālāḥ | adhaśca mūlānyanusantatāni | karmānubandhīni manuṣyaloke</blockquote>
<p class="gloss">Below and above stretch its branches, grown by the strands, their shoots the sense-fields; and its secondary roots run below, binding through action, in the world of humans.</p>
</figure>

<figure class="verse" data-verse="15.3">
<figcaption>Bhagavad Gita 15.3</figcaption>
<blockquote class="iast">na rūpamasyeha tathopalabhyate | nānto na cādirna ca sampratiṣṭhā | aśvatthamenaṃ suvirūḍhamūlaṃ | asaṅgaśastreṇa dṛḍhena chittvā</blockquote>
<p class="gloss">Its form here is not grasped like that — no end, no beginning, no resting place. This banyan of firm-rooted form is to be cut down with the strong axe of non-attachment.</p>
</figure>

<figure class="verse" data-verse="15.4">
<figcaption>Bhagavad Gita 15.4</figcaption>
<blockquote class="iast">tataḥ padaṃ tatparimārgitavyaṃ | yasmingatā na nivartanti bhūyaḥ | tameva cādyaṃ puruṣaṃ prapadye | yataḥ pravṛttiḥ prasṛtā purāṇī</blockquote>
<p class="gloss">Then that resting-place is to be sought, going where one does not return again: &#x27;I take refuge in that first person from whom this ancient current set forth.&#x27;</p>
</figure>

<figure class="verse" data-verse="15.6">
<figcaption>Bhagavad Gita 15.6</figcaption>
<blockquote class="iast">na tadbhāsayate sūryo na śaśāṅko na pāvakaḥ | yadgatvā na nivartante taddhāma paramaṃ mama</blockquote>
<p class="gloss">That, my highest abode, is lit by neither sun nor moon nor fire; going there, none return.</p>
</figure>

<figure class="verse" data-verse="15.15">
<figcaption>Bhagavad Gita 15.15</figcaption>
<blockquote class="iast">sarvasya cāhaṃ hṛdi sanniviṣṭo | mattaḥ smṛtirjñānamapohanañca | vedaiśca sarvairahameva vedyo | vedāntakṛdvedavideva cāham</blockquote>
<p class="gloss">And I am seated in the hearts of all; from me come memory, knowledge and their loss; by all the Vedas I alone am to be known; I am the maker of Vedanta, the knower of the Veda.</p>
</figure>

<figure class="verse" data-verse="15.16">
<figcaption>Bhagavad Gita 15.16</figcaption>
<blockquote class="iast">dvāvimau puruṣau loke kṣaraścākṣara eva ca | kṣaraḥ sarvāṇi bhūtāni kūṭastho&#x27;kṣara ucyate</blockquote>
<p class="gloss">There are two persons in this world: the perishable and the imperishable; the perishable is all beings; the fixed one is called the imperishable.</p>
</figure>

<figure class="verse" data-verse="15.17">
<figcaption>Bhagavad Gita 15.17</figcaption>
<blockquote class="iast">uttamaḥ puruṣastvanyaḥ paramātmetyudāhṛtaḥ | yo lokatrayamāviśya bibhartyavyaya īśvaraḥ</blockquote>
<p class="gloss">But other than both is the highest person, called the highest self — entering the three worlds, upholding them, the imperishable lord.</p>
</figure>

<figure class="verse" data-verse="15.18">
<figcaption>Bhagavad Gita 15.18</figcaption>
<blockquote class="iast">yasmātkṣaramatīto&#x27;hamakṣarādapi cottamaḥ | ato&#x27;smi loke vede ca prathitaḥ puruṣottamaḥ</blockquote>
<p class="gloss">Because I am beyond the perishable, and higher even than the imperishable — in the world and in the Veda I am celebrated as the highest person.</p>
<p class="note"><strong>Translation note</strong> The &#x27;puruṣottama&#x27; three-tier ontology — the verse that gives the chapter its name.</p>
</figure>
