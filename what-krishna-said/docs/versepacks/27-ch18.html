<figure class="verse" data-verse="18.1">
<figcaption>Bhagavad Gita 18.1</figcaption>
<blockquote class="iast">saṃnyāsasya mahābāho tattvamicchāmi veditum | tyāgasya ca hṛṣīkeśa pṛthakkeśiniṣūdana</blockquote>
<p class="gloss">Arjuna: I wish to know the truth of renunciation, Hrishikesha, and of letting-go — and their difference, slayer of foes.</p>
</figure>

<figure class="verse" data-verse="18.2">
<figcaption>Bhagavad Gita 18.2</figcaption>
<blockquote class="iast">kāmyānāṃ karmaṇāṃ nyāsaṃ saṃnyāsaṃ kavayo viduḥ | sarvakarmaphalatyāgaṃ prāhustyāgaṃ vicakṣaṇāḥ</blockquote>
<p class="gloss">Krishna: The giving up of desire-driven actions — that the sages call renunciation; the relinquishing of the fruits of all actions — that the discerning call letting-go.</p>
<p class="note"><strong>Translation note</strong> The Gita&#x27;s closing vocabulary fix: saṃnyāsa vs tyāga. Tilak and Gandhi both hang their readings on this distinction.</p>
</figure>

<figure class="verse" data-verse="18.13">
<figcaption>Bhagavad Gita 18.13</figcaption>
<blockquote class="iast">pañcaitāni mahābāho kāraṇāni nibodha me | sāṅkhye kṛtānte proktāni siddhaye sarvakarmaṇām</blockquote>
<p class="gloss">Learn from me, mighty-armed one, these five causes, as declared in the analysis of the completion of all actions.</p>
</figure>

<figure class="verse" data-verse="18.14">
<figcaption>Bhagavad Gita 18.14</figcaption>
<blockquote class="iast">adhiṣṭhānaṃ tathā kartā karaṇaṃ ca pṛthagvidham | vividhāśca pṛthakceṣṭā daivaṃ caivātra pañcamam</blockquote>
<p class="gloss">The seat or body; the doer; the instruments, various; the several kinds of movement — and the divine, the fifth.</p>
</figure>

<figure class="verse" data-verse="18.15">
<figcaption>Bhagavad Gita 18.15</figcaption>
<blockquote class="iast">śarīravāṅmanobhiryatkarma prārabhate naraḥ | nyāyyaṃ vā viparītaṃ vā pañcaite tasya hetavaḥ</blockquote>
<p class="gloss">Whatever act a person sets going by body, speech or mind — right or wrong — these five are its causes.</p>
</figure>

<figure class="verse" data-verse="18.41">
<figcaption>Bhagavad Gita 18.41</figcaption>
<blockquote class="iast">brāhmaṇakṣatriyaviśāṃ śūdrāṇāṃ ca parantapa | karmāṇi pravibhaktāni svabhāvaprabhavairguṇaiḥ</blockquote>
<p class="gloss">The actions of brahmins, kshatriyas, vaishyas and shudras, scorcher of foes, are distributed by the strands born of each one&#x27;s own nature.</p>
</figure>

<figure class="verse" data-verse="18.47">
<figcaption>Bhagavad Gita 18.47</figcaption>
<blockquote class="iast">śreyānsvadharmo viguṇaḥ paradharmātsvanuṣṭhitāt | svabhāvaniyataṃ karma kurvannāpnoti kilbiṣam</blockquote>
<p class="gloss">Better one&#x27;s own duty, though imperfect, than another&#x27;s well done; acting by the work born of one&#x27;s own nature, one incurs no wrong.</p>
<p class="note"><strong>Translation note</strong> The second svadharma verse. In Sanskrit law-commentary tradition these verses underwrote hereditary occupation; in modern readings they are defended, allegorized or condemned.</p>
</figure>

<figure class="verse" data-verse="18.61">
<figcaption>Bhagavad Gita 18.61</figcaption>
<blockquote class="iast">īśvaraḥ sarvabhūtānāṃ hṛddeśe&#x27;rjuna tiṣṭhati | bhrāmayansarvabhūtāni yantrārūḍhāni māyayā</blockquote>
<p class="gloss">The lord dwells in the hearts of all beings, Arjuna, whirling all beings, seated as if on a machine, by his māyā.</p>
<p class="note"><strong>Translation note</strong> The machine image (yantra) — determinism&#x27;s sharpest image in the Gita; the verses after it pivot immediately to refuge as the exit.</p>
</figure>

<figure class="verse" data-verse="18.65">
<figcaption>Bhagavad Gita 18.65</figcaption>
<blockquote class="iast">manmanā bhava madbhakto madyājī māṃ namaskuru | māmevaiṣyasi satyaṃ te pratijāne priyo&#x27;si me</blockquote>
<p class="gloss">Set your mind on me, be my devotee, sacrifice to me, bow to me; so you will come to me — truly I promise: you are dear to me.</p>
</figure>

<figure class="verse" data-verse="18.66">
<figcaption>Bhagavad Gita 18.66</figcaption>
<blockquote class="iast">sarvadharmānparityajya māmekaṃ śaraṇaṃ vraja | ahaṃ tvā sarvapāpebhyo mokṣayiṣyāmi mā śucaḥ</blockquote>
<p class="gloss">Letting go all duties, come take refuge in me alone; I will free you from all wrongs — do not grieve.</p>
<p class="note"><strong>Translation note</strong> The &#x27;charama śloka&#x27;. Whether &#x27;abandoning all dharmas&#x27; means abandoning works for grace (Ramanuja), or the ego&#x27;s claim on outcomes (Gandhi), or exclusive devotion (Bhaktivedanta) — this single verse holds the entire interpretive war.</p>
</figure>

<figure class="verse" data-verse="18.73">
<figcaption>Bhagavad Gita 18.73</figcaption>
<blockquote class="iast">naṣṭo mohaḥ smṛtirlabdhā tvatprasādānmayācyuta | sthito&#x27;smi gatasandehaḥ kariṣye vacanaṃ tava</blockquote>
<p class="gloss">Arjuna: My delusion is destroyed; memory is recovered — by your grace, unfailing one. I stand, my doubt gone: I will do as you say.</p>
<p class="note"><strong>Translation note</strong> The poem ends with consent, not conviction — Arjuna says &#x27;I will act on your word&#x27;, and the war proceeds.</p>
</figure>

<figure class="verse" data-verse="18.78">
<figcaption>Bhagavad Gita 18.78</figcaption>
<blockquote class="iast">yatra yogeśvaraḥ kṛṣṇo yatra pārtho dhanurdharaḥ | tatra śrīrvijayo bhūtirdhruvā nītirmatirmama</blockquote>
<p class="gloss">Sanjaya: Where Krishna is the lord of yoga, where Partha is the wielder of the bow — there are splendor, victory, growth, and unshakable counsel — such is my thought.</p>
<p class="note"><strong>Translation note</strong> The closing verse, from the reporter Sanjaya — the Gita&#x27;s own last word is about the pair: teacher and archer, in that order.</p>
</figure>
