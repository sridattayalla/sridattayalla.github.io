<figure class="verse" data-verse="5.2">
<figcaption>Bhagavad Gita 5.2</figcaption>
<blockquote class="iast">saṃnyāsaḥ karmayogaśca niḥśreyasakarāvubhau | tayostu karmasaṃnyāsātkarmayogo viśiṣyate</blockquote>
<p class="gloss">Both renunciation and karma-yoga carry one to the highest; of the two, karma-yoga excels renunciation of action.</p>
<p class="note"><strong>Translation note</strong> The verdict Tilak built his whole Gita Rahasya on.</p>
</figure>

<figure class="verse" data-verse="5.8">
<figcaption>Bhagavad Gita 5.8</figcaption>
<blockquote class="iast">naiva kiñcitkaromīti yukto manyeta tattvavit | paśyañśṛṇvanspṛśañjighrannaśnangacchansvapañśvasan</blockquote>
<p class="gloss">The one yoked in knowledge, knowing the real, thinks &#x27;I do nothing at all&#x27; — while seeing, hearing, touching, smelling, eating, walking, sleeping, breathing.</p>
</figure>

<figure class="verse" data-verse="5.9">
<figcaption>Bhagavad Gita 5.9</figcaption>
<blockquote class="iast">pralapanvisṛjangṛhṇannunmiṣannimiṣannapi | indriyāṇīndriyārtheṣu vartanta iti dhārayan</blockquote>
<p class="gloss">Speaking, releasing, taking, opening and closing the eyes, he holds firmly: &#x27;it is the senses that move among their objects.&#x27;</p>
</figure>

<figure class="verse" data-verse="5.18">
<figcaption>Bhagavad Gita 5.18</figcaption>
<blockquote class="iast">vidyāvinayasampanne brāhmaṇe gavi hastini | śuni caiva śvapāke ca paṇḍitāḥ samadarśinaḥ</blockquote>
<p class="gloss">The learned see the same in a brahmin of learning and courtesy, in a cow, in an elephant, in a dog — and in a dog-cooker.</p>
<p class="note"><strong>Translation note</strong> &#x27;Śvapāka&#x27; literally &#x27;dog-cooker&#x27;, an outcaste occupation. The verse&#x27;s radical equality claim coexists in the same text with 4.13 and 18.41 — a tension every reader must place somewhere.</p>
</figure>

<figure class="verse" data-verse="5.29">
<figcaption>Bhagavad Gita 5.29</figcaption>
<blockquote class="iast">bhoktāraṃ yajñatapasāṃ sarvalokamaheśvaram | suhṛdaṃ sarvabhūtānāṃ jñātvā māṃ śāntimṛcchati</blockquote>
<p class="gloss">Knowing me as the enjoyer of sacrifices and austerities, as the great lord of all worlds, as the friend of all beings — one attains peace.</p>
</figure>
