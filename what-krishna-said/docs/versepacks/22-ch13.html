<figure class="verse" data-verse="13.1">
<figcaption>Bhagavad Gita 13.1</figcaption>
<blockquote class="iast">prakṛtiṃ puruṣaṃ caiva kṣetraṃ kṣetrajñameva ca | etadveditumicchāmi jñānaṃ jñeyaṃ ca keśava</blockquote>
<p class="gloss">Arjuna: Nature and the person, the field and the knower of the field, knowledge and the knowable — these I wish to know, Keshava.</p>
</figure>

<figure class="verse" data-verse="13.2">
<figcaption>Bhagavad Gita 13.2</figcaption>
<blockquote class="iast">idaṃ śarīraṃ kaunteya kṣetramityabhidhīyate | etadyo vetti taṃ prāhuḥ kṣetrajña iti tadvidaḥ</blockquote>
<p class="gloss">Krishna: This body is called the field, son of Kunti; and the one who knows it — those who know call that one the knower of the field.</p>
</figure>

<figure class="verse" data-verse="13.7">
<figcaption>Bhagavad Gita 13.7</figcaption>
<blockquote class="iast">icchā dveṣaḥ sukhaṃ duḥkhaṃ saṅghātaścetanā dhṛtiḥ | etatkṣetraṃ samāsena savikāramudāhṛtam</blockquote>
<p class="gloss">Desire, aversion, pleasure, pain, the aggregate, awareness, resolve — this, in brief, with its workings, is what is called the field.</p>
</figure>

<figure class="verse" data-verse="13.8">
<figcaption>Bhagavad Gita 13.8</figcaption>
<blockquote class="iast">amānitvamadambhitvamahiṃsā kṣāntirārjavam | ācāryopāsanaṃ śaucaṃ sthairyamātmavinigrahaḥ</blockquote>
<p class="gloss">Humility, unpretentiousness, non-injury, patience, uprightness; serving the teacher, purity, steadiness, self-restraint.</p>
</figure>

<figure class="verse" data-verse="13.19">
<figcaption>Bhagavad Gita 13.19</figcaption>
<blockquote class="iast">iti kṣetraṃ tathā jñānaṃ jñeyaṃ coktaṃ samāsataḥ | madbhakta etadvijñāya madbhāvāyopapadyate</blockquote>
<p class="gloss">Thus have the field, knowledge and the knowable been set out in brief; my devotee, knowing this, enters into my being.</p>
</figure>

<figure class="verse" data-verse="13.20">
<figcaption>Bhagavad Gita 13.20</figcaption>
<blockquote class="iast">prakṛtiṃ puruṣaṃ caiva viddhyanādī ubhāvapi | vikārāṃśca guṇāṃścaiva viddhi prakṛtisambhavān</blockquote>
<p class="gloss">Know nature and the person alike as without beginning; know the alterations and the strands as born of nature.</p>
</figure>

<figure class="verse" data-verse="13.23">
<figcaption>Bhagavad Gita 13.23</figcaption>
<blockquote class="iast">upadraṣṭānumantā ca bhartā bhoktā maheśvaraḥ | paramātmeti cāpyukto dehe&#x27;sminpuruṣaḥ paraḥ</blockquote>
<p class="gloss">The witness, the permitter, the supporter, the enjoyer, the great lord — and what is also called the highest self — this is the person in this body.</p>
</figure>

<figure class="verse" data-verse="13.27">
<figcaption>Bhagavad Gita 13.27</figcaption>
<blockquote class="iast">yāvatsañjāyate kiñcitsattvaṃ sthāvarajaṅgamam | kṣetrakṣetrajñasaṃyogāttadviddhi bharatarṣabha</blockquote>
<p class="gloss">Whatever comes into being, moving or unmoving — know, bull of Bharata, that it is born of the union of the field and its knower.</p>
</figure>

<figure class="verse" data-verse="13.28">
<figcaption>Bhagavad Gita 13.28</figcaption>
<blockquote class="iast">samaṃ sarveṣu bhūteṣu tiṣṭhantaṃ parameśvaram | vinaśyatsvavinaśyantaṃ yaḥ paśyati sa paśyati</blockquote>
<p class="gloss">Who sees the same lord standing within all beings, perishing as they perish — that one truly sees.</p>
</figure>
