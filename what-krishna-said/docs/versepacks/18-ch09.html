<figure class="verse" data-verse="9.4">
<figcaption>Bhagavad Gita 9.4</figcaption>
<blockquote class="iast">mayā tatamidaṃ sarvaṃ jagadavyaktamūrtinā | matsthāni sarvabhūtāni na cāhaṃ teṣvavasthitaḥ</blockquote>
<p class="gloss">All this world is pervaded by me in unmanifest form; in me all beings stand — yet I do not stand in them.</p>
<p class="note"><strong>Translation note</strong> The classic panentheist formula: God in the world, the world in God, and yet not identical.</p>
</figure>

<figure class="verse" data-verse="9.22">
<figcaption>Bhagavad Gita 9.22</figcaption>
<blockquote class="iast">ananyāścintayanto māṃ ye janāḥ paryupāsate | teṣāṃ nityābhiyuktānāṃ yogakṣemaṃ vahāmyaham</blockquote>
<p class="gloss">Those who, meditating, worship me with minds nowhere else — I myself carry for them, ever-yoked ones, their yoga and their kshema.</p>
<p class="note"><strong>Translation note</strong> &#x27;Yoga-kṣema&#x27; is a technical pair: what is attained and what is safeguarded. Rendered variously as &#x27;what they need and what they have&#x27;.</p>
</figure>

<figure class="verse" data-verse="9.26">
<figcaption>Bhagavad Gita 9.26</figcaption>
<blockquote class="iast">patraṃ puṣpaṃ phalaṃ toyaṃ yo me bhaktyā prayacchati | tadahaṃ bhaktyupahṛtamaśnāmi prayatātmanaḥ</blockquote>
<p class="gloss">A leaf, a flower, a fruit, water — whoever offers it to me with devotion, that I receive from the striving soul.</p>
</figure>

<figure class="verse" data-verse="9.29">
<figcaption>Bhagavad Gita 9.29</figcaption>
<blockquote class="iast">samo&#x27;haṃ sarvabhūteṣu na me dveṣyo&#x27;sti na priyaḥ | ye bhajanti tu māṃ bhaktyā mayi te teṣu cāpyaham</blockquote>
<p class="gloss">I am the same toward all beings; to me none is hateful, and none is dear; but those who worship me with devotion are in me — and I in them.</p>
</figure>

<figure class="verse" data-verse="9.30">
<figcaption>Bhagavad Gita 9.30</figcaption>
<blockquote class="iast">api cetsudurācāro bhajate māmananyabhāk | sādhureva sa mantavyaḥ samyagvyavasito hi saḥ</blockquote>
<p class="gloss">Even if one of utterly wicked conduct worships me with single devotion, that one is to be counted righteous — rightly resolved.</p>
</figure>

<figure class="verse" data-verse="9.31">
<figcaption>Bhagavad Gita 9.31</figcaption>
<blockquote class="iast">kṣipraṃ bhavati dharmātmā śaśvacchāntiṃ nigacchati | kaunteya pratijānīhi na me bhaktaḥ praṇaśyati</blockquote>
<p class="gloss">Soon he becomes a man of dharma and attains lasting peace; know this for certain, son of Kunti: my devotee is never lost.</p>
</figure>

<figure class="verse" data-verse="9.32">
<figcaption>Bhagavad Gita 9.32</figcaption>
<blockquote class="iast">māṃ hi pārtha vyapāśritya ye&#x27;pi syuḥ pāpayonayaḥ | striyo vaiśyāstathā śūdrāste&#x27;pi yānti parāṃ gatim</blockquote>
<p class="gloss">Taking refuge in me, even those born of ill wombs — women, vaishyas, shudras likewise — even they go the highest way.</p>
<p class="note"><strong>Translation note</strong> The Gita&#x27;s most debated inclusion verse: does &#x27;even they&#x27; open heaven&#x27;s door to the excluded, or confirm who was excluded? Read both ways across two millennia.</p>
</figure>

<figure class="verse" data-verse="9.34">
<figcaption>Bhagavad Gita 9.34</figcaption>
<blockquote class="iast">manmanā bhava madbhakto madyājī māṃ namaskuru | māmevaiṣyasi yuktvaivamātmānaṃ matparāyaṇaḥ</blockquote>
<p class="gloss">Set your mind on me, be my devotee, sacrifice to me, bow to me; yoked to me, with me as your highest end — you will come to me.</p>
</figure>
